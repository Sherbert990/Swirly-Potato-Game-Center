<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Orbit Dodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0d0b1f;
    --bg-1:#17122e;
    --core:#8fe4ff;
    --player:#ffcb6b;
    --player-glow:#ff9d5c;
    --gap:#6ff0d0;
    --danger:#ff5c8a;
    --coin:#ffcb6b;
    --ink:#eae6ff;
    --ink-dim:#9891c4;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:radial-gradient(120% 120% at 50% 40%, var(--bg-1) 0%, var(--bg-0) 70%);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    user-select:none;
  }
  #stage{
    position:relative;
    width:min(100vw,100vh);
    height:min(100vw,100vh);
    max-width:640px;max-height:640px;
  }
  canvas{display:block;width:100%;height:100%;border-radius:24px;cursor:pointer;}

  /* HUD */
  #hud{position:absolute;top:20px;left:0;right:0;text-align:center;pointer-events:none;}
  #level-hud{
    font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gap);opacity:.85;margin-bottom:3px;
  }
  #score{
    font-size:clamp(38px,11vmin,68px);
    font-weight:700;letter-spacing:-.02em;color:var(--ink);
    text-shadow:0 0 24px rgba(143,228,255,.25);
    font-variant-numeric:tabular-nums;line-height:1;
  }
  #coin-hud{margin-top:6px;font-size:13px;font-weight:600;color:var(--coin);letter-spacing:.04em;font-variant-numeric:tabular-nums;}
  #coin-hud::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--coin);margin-right:6px;vertical-align:middle;box-shadow:0 0 6px rgba(255,203,107,.5);}

  /* Mute toggle */
  #mute{
    position:absolute;top:16px;right:16px;z-index:5;
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(234,230,255,.06);border:1px solid rgba(234,230,255,.18);
    color:var(--ink-dim);font-size:16px;line-height:1;cursor:pointer;transition:.15s;
    -webkit-user-select:none;user-select:none;
  }
  #mute:hover{background:rgba(234,230,255,.14);color:var(--ink);}
  #mute.muted{color:var(--danger);border-color:rgba(255,92,138,.4);}

  /* Score pop on a threaded gap */
  #score.pop{animation:scorepop .2s ease;}
  @keyframes scorepop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}

  #banner{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(44px,15vmin,92px);font-weight:700;letter-spacing:-.02em;
    color:var(--ink);pointer-events:none;opacity:0;
    text-shadow:0 0 30px rgba(111,240,208,.4);
  }
  #banner.show{animation:banner 1.1s ease forwards;}
  @keyframes banner{
    0%{opacity:0;transform:scale(.7)}
    18%{opacity:1;transform:scale(1)}
    70%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.18)}
  }

  /* Overlays */
  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px 26px;
    background:radial-gradient(80% 80% at 50% 50%, rgba(13,11,31,.6), rgba(13,11,31,.9));
    backdrop-filter:blur(3px);
    transition:opacity .22s ease;
    border-radius:24px;
  }
  .overlay.hidden{opacity:0;pointer-events:none;}
  #store,#levels{justify-content:flex-start;overflow-y:auto;padding-top:34px;padding-bottom:34px;}

  .title{font-size:clamp(40px,13vmin,76px);font-weight:700;letter-spacing:-.03em;line-height:.95;}
  .title .o{color:var(--player);}
  .title .d{color:var(--gap);}
  .tag{margin-top:12px;font-size:14px;color:var(--ink-dim);letter-spacing:.02em;max-width:26ch;line-height:1.5;}

  /* Buttons */
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);background:rgba(234,230,255,.06);
    border:1px solid rgba(234,230,255,.2);border-radius:999px;
    padding:14px 30px;cursor:pointer;transition:.15s;min-width:190px;
  }
  .btn:hover{background:rgba(234,230,255,.14);border-color:rgba(234,230,255,.4);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--player);color:#2a1c05;border-color:var(--player);}
  .btn.primary:hover{filter:brightness(1.08);background:var(--player);}
  .btn.ghost{background:transparent;border-color:rgba(234,230,255,.18);font-size:12px;padding:10px 20px;min-width:0;}
  .btn:focus-visible{outline:2px solid var(--gap);outline-offset:2px;}
  .menu-btns{display:flex;flex-direction:column;gap:12px;margin-top:28px;align-items:center;width:100%;max-width:230px;}
  .menu-btns .btn{width:100%;}

  .coins{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:15px;color:var(--coin);letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  .coins::before{content:'';display:inline-block;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffe6a8, var(--coin));box-shadow:0 0 8px rgba(255,203,107,.5);}
  #coins-menu{margin-top:20px;}

  /* Game over */
  .final-label{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
  .final-score{font-size:clamp(52px,17vmin,100px);font-weight:700;letter-spacing:-.03em;color:var(--player);line-height:1;margin-top:2px;}
  .over-level{margin-top:8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);}
  .best-line{margin-top:14px;font-size:15px;color:var(--ink);}
  .best-line b{color:var(--gap);}
  .newbest{color:var(--player);font-weight:700;letter-spacing:.04em;}

  /* Screen headers (levels / store) */
  .screen-head{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:380px;margin-bottom:4px;}
  .screen-title{font-size:22px;font-weight:700;letter-spacing:-.01em;}

  /* Level grid */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:340px;margin-top:20px;}
  .lvl{
    aspect-ratio:1;font-family:inherit;font-size:19px;font-weight:700;
    color:var(--ink-dim);background:rgba(234,230,255,.05);
    border:1px solid rgba(234,230,255,.12);border-radius:14px;cursor:pointer;transition:.15s;
  }
  .lvl:hover{background:rgba(234,230,255,.12);color:var(--ink);}
  .lvl.reached{color:var(--ink);border-color:rgba(111,240,208,.45);box-shadow:inset 0 0 0 1px rgba(111,240,208,.12);}
  .lvl:active{transform:translateY(1px);}

  /* Store */
  .store-scroll{width:100%;max-width:380px;margin-top:8px;}
  .store-section-title{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin:18px 0 10px;text-align:left;}
  .item{display:flex;align-items:center;gap:14px;padding:12px 14px;background:rgba(234,230,255,.05);border:1px solid rgba(234,230,255,.1);border-radius:14px;margin-bottom:9px;text-align:left;}
  .item .swatch{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.14);}
  .item-info{flex:1;min-width:0;}
  .item-name{font-size:15px;font-weight:600;color:var(--ink);}
  .item-desc{font-size:12.5px;color:var(--ink-dim);margin-top:2px;line-height:1.35;}
  .item-action{flex:none;}
  .buy{font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;border-radius:999px;cursor:pointer;border:1px solid var(--player);background:var(--player);color:#2a1c05;transition:.15s;white-space:nowrap;}
  .buy:hover{filter:brightness(1.08);}
  .buy:disabled{opacity:.35;cursor:not-allowed;}
  .buy.owned{background:transparent;color:var(--ink-dim);border-color:rgba(234,230,255,.2);cursor:default;}
  .buy.equip{background:transparent;color:var(--gap);border-color:rgba(111,240,208,.5);}
  .buy.equipped{background:rgba(111,240,208,.14);color:var(--gap);border-color:rgba(111,240,208,.5);cursor:default;}

  @media (prefers-reduced-motion: reduce){#banner.show{animation:none;opacity:0}#score.pop{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="mute" aria-label="Mute">&#9834;</button>

  <div id="hud">
    <div id="level-hud">Level 1</div>
    <div id="score">0</div>
    <div id="coin-hud">0</div>
  </div>
  <div id="banner"></div>

  <!-- Main menu -->
  <div id="start" class="overlay">
    <div class="title"><span class="o">Orbit</span> <span class="d">Dodge</span></div>
    <div class="tag">Circle the core. Tap to reverse and thread each gap before it reaches you.</div>
    <div class="coins" id="coins-menu">0</div>
    <div class="menu-btns">
      <button class="btn primary" id="btn-play">Play</button>
      <button class="btn" id="btn-levels">Levels</button>
      <button class="btn" id="btn-store">Store</button>
    </div>
  </div>

  <!-- Level select -->
  <div id="levels" class="overlay hidden">
    <div class="screen-head">
      <div class="screen-title">Levels</div>
      <button class="btn ghost" data-back>Back</button>
    </div>
    <div class="tag" style="margin-top:2px">Jump to any level. Cleared levels are outlined.</div>
    <div class="grid" id="lvl-grid"></div>
  </div>

  <!-- Store is the shared hub overlay (GameCenter.openStore); no local store screen. -->

  <!-- Game over -->
  <div id="over" class="overlay hidden">
    <div class="final-label">Score</div>
    <div class="final-score" id="final">0</div>
    <div class="over-level" id="overlevel"></div>
    <div class="coins" id="coins-earned" style="margin-top:12px">+0</div>
    <div class="best-line" id="bestline"></div>
    <div class="menu-btns">
      <button class="btn primary" id="btn-retry">Retry</button>
      <div style="display:flex;gap:10px;width:100%;">
        <button class="btn" id="btn-over-levels" style="min-width:0;flex:1;padding-left:0;padding-right:0;">Levels</button>
        <button class="btn" id="btn-over-store" style="min-width:0;flex:1;padding-left:0;padding-right:0;">Store</button>
      </div>
      <button class="btn ghost" id="btn-over-menu">Menu</button>
    </div>
  </div>
</div>

<script src="/shared/gamecenter.js"></script>
<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const levelHud = document.getElementById('level-hud');
  const coinHud = document.getElementById('coin-hud');
  const banner = document.getElementById('banner');
  const finalEl = document.getElementById('final');
  const overLevel = document.getElementById('overlevel');
  const coinsEarned = document.getElementById('coins-earned');
  const bestLine = document.getElementById('bestline');

  const startOv = document.getElementById('start');
  const levelsOv = document.getElementById('levels');
  const overOv = document.getElementById('over');
  const screens = { start:startOv, levels:levelsOv, over:overOv };

  const css = getComputedStyle(document.documentElement);
  const C = {
    core: css.getPropertyValue('--core').trim(),
    player: css.getPropertyValue('--player').trim(),
    playerGlow: css.getPropertyValue('--player-glow').trim(),
    gap: css.getPropertyValue('--gap').trim(),
    danger: css.getPropertyValue('--danger').trim(),
  };

  /* ---------- Ring skins: colour params only. Names, prices and ownership live in
     shared/catalog.json (the shared Store); the equipped id is a GameCenter pref. ---------- */
  const SKINS = [
    {id:'aurora',   base:218, step:20, sat:72, lig:64},
    {id:'ember',    base:18,  step:8,  sat:82, lig:60},
    {id:'toxic',    base:112, step:14, sat:70, lig:58},
    {id:'rose',     base:330, step:12, sat:76, lig:66},
    {id:'mono',     base:0,   step:0,  sat:0,  lig:84},
    {id:'spectrum', rainbow:true},
  ];

  /* ---------- Local save: bests + audio pref only ---------- */
  const KEY = 'orbitDodgeSave';
  let save = { best:0, highestLevel:1, muted:false };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw){ const s = JSON.parse(raw); save.best = s.best||0; save.highestLevel = s.highestLevel||1; save.muted = !!s.muted; }
  } catch(e){}
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} }

  /* ---------- Shared hub wallet (coins + purchased upgrades) via GameCenter.
     Coins bank on death; upgrades are owned server-side; the equipped skin is a pref. ---------- */
  const gc = (window.GameCenter && GameCenter.game) ? GameCenter.game('orbit-dodge') : null;
  const UP_KEYS = { shield:'orbit_shield', slowstart:'orbit_slowstart', steady:'orbit_steady' };
  let coins = 0, walletItems = {};
  function hasUpgrade(id){ return (walletItems[UP_KEYS[id]] || 0) > 0; }
  function equippedSkinId(){ return (window.GameCenter && GameCenter.getPref) ? GameCenter.getPref('orbitSkin', 'aurora') : 'aurora'; }
  function refreshCoinsUI(){ const m = document.getElementById('coins-menu'); if (m) m.textContent = coins; }
  function onWallet(u){ if (!u) return; coins = u.coins || 0; walletItems = u.items || {}; refreshCoinsUI(); }
  if (gc) gc.onWallet(onWallet);
  function openHubStore(){ if (window.GameCenter && GameCenter.openStore) GameCenter.openStore('orbit-dodge'); }

  /* ---------- Audio (procedural, no assets) ---------- */
  let muted = !!save.muted, actx = null;
  function ac(){
    if (muted) return null;
    if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function blip(freq, dur, type, gain, slideTo){
    const a = ac(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.1, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noiseHit(dur, gain){
    const a = ac(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const s = a.createBufferSource(); s.buffer = buf;
    const g = a.createGain(); g.gain.value = gain;
    s.connect(g); g.connect(a.destination); s.start();
  }
  const SFX = {
    reverse(){ blip(300, 0.05, 'square', 0.045, 440); },
    score(n){ blip(520 + Math.min(n,14)*26, 0.10, 'triangle', 0.09); },
    level(){ [523,659,784,1046].forEach((f,i) => setTimeout(() => blip(f, 0.16, 'triangle', 0.09), i*70)); },
    shield(){ blip(180, 0.18, 'sawtooth', 0.11, 70); noiseHit(0.1, 0.08); },
    die(){ blip(320, 0.5, 'sawtooth', 0.13, 60); noiseHit(0.28, 0.16); },
  };
  function haptic(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

  function skinById(id){ return SKINS.find(s => s.id === id) || SKINS[0]; }
  function ringColorFor(skin, lvl, idx){
    if (skin.rainbow){ return 'hsl(' + ((idx*47) % 360) + ',80%,62%)'; }
    const h = (skin.base + (lvl-1) * skin.step) % 360;
    return 'hsl(' + h + ',' + skin.sat + '%,' + skin.lig + '%)';
  }

  /* ---------- Canvas sizing ---------- */
  let W=0,H=0,CX=0,CY=0,R=0,dpr=1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = stage.getBoundingClientRect();
    W = rect.width; H = rect.height;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    CX = W/2; CY = H/2; R = Math.min(W,H)*0.34;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- Game state ---------- */
  const STATE = { MENU:0, PLAY:1, OVER:2 };
  let state = STATE.MENU;

  let playerAngle = -Math.PI/2, dir = 1;
  const playerSpeed = 2.6;
  const trail = [];

  let rings = [], particles = [];
  let spawnTimer = 0, elapsed = 0, runTime = 0, shake = 0, shieldFlash = 0, deathFlash = 0;
  let score = 0, level = 1, gapsThisLevel = 0, coinsRun = 0, ringCount = 0, shields = 0;
  let runStartLevel = 1;

  const RINGS_PER_LEVEL = 6;

  // Level 1 is deliberately gentle: slow rings, wide gaps, lots of spacing.
  function ringSpeed(){ return Math.min(38 + (level-1)*9, 215); }             // px/s
  function spawnInterval(){ return Math.max(0.72, 2.2 - (level-1)*0.09); }     // seconds
  function gapHalfWidth(){
    let g = Math.max(0.38, 1.02 - (level-1)*0.055);                           // radians
    if (hasUpgrade('steady')) g += 0.07;
    return g;
  }
  function moveScale(){ return (hasUpgrade('slowstart') && runTime < 5) ? 0.55 : 1; }

  function reset(atLevel){
    level = atLevel || 1;
    runStartLevel = level;
    score = 0; gapsThisLevel = 0; coinsRun = 0; ringCount = 0;
    playerAngle = -Math.PI/2; dir = 1;
    rings = []; particles = []; trail.length = 0;
    spawnTimer = 0.5; elapsed = 0; runTime = 0; shake = 0; shieldFlash = 0; deathFlash = 0;
    shields = hasUpgrade('shield') ? 1 : 0;
    if (level > save.highestLevel){ save.highestLevel = level; persist(); }
    updateHud();
    banner.classList.remove('show');
  }

  function updateHud(){
    levelHud.textContent = 'Level ' + level;
    scoreEl.textContent = score;
    coinHud.textContent = coinsRun;
  }

  function spawnRing(){
    ringCount++;
    const skin = skinById(equippedSkinId());
    rings.push({
      r:6, gap:Math.random()*Math.PI*2, gh:gapHalfWidth(),
      spd:ringSpeed(), color:ringColorFor(skin, level, ringCount),
      scored:false, dead:0
    });
  }

  function scorePoint(){
    score++; coinsRun += 1; gapsThisLevel++;
    const p = playerPos();
    spark(p.x, p.y, C.gap);
    scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop');
    SFX.score(score);
    if (gapsThisLevel >= RINGS_PER_LEVEL){ gapsThisLevel = 0; level++; onLevelUp(); }
    updateHud();
  }

  function onLevelUp(){
    coinsRun += 5;
    if (level > save.highestLevel){ save.highestLevel = level; persist(); }
    banner.textContent = 'Level ' + level;
    banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
    shake = Math.max(shake, 6);
    SFX.level();
    updateHud();
  }

  function angDist(a,b){
    let d = (a-b) % (Math.PI*2);
    if (d > Math.PI) d -= Math.PI*2;
    if (d < -Math.PI) d += Math.PI*2;
    return Math.abs(d);
  }
  function playerPos(){ return { x:CX+Math.cos(playerAngle)*R, y:CY+Math.sin(playerAngle)*R }; }

  function burst(x,y,color){
    for (let i=0;i<26;i++){
      const a = Math.random()*Math.PI*2, sp = 60+Math.random()*220;
      particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, r:2+Math.random()*3, color });
    }
  }
  // Small positive flourish when a gap is threaded.
  function spark(x,y,color){
    for (let i=0;i<7;i++){
      const a = Math.random()*Math.PI*2, sp = 40+Math.random()*120;
      particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, r:1.5+Math.random()*2, color });
    }
  }

  function die(){
    const p = playerPos();
    burst(p.x, p.y, C.danger);
    shake = 16; deathFlash = 0.5;
    SFX.die(); haptic(60);
    state = STATE.OVER;

    const isNew = score > save.best;
    if (isNew) save.best = score;
    persist();
    if (gc) gc.bank(score, coinsRun);          // bank coins + submit score to the shared leaderboard
    else { coins += coinsRun; refreshCoinsUI(); }

    finalEl.textContent = score;
    overLevel.textContent = 'Reached level ' + level;
    coinsEarned.textContent = '+' + coinsRun;
    bestLine.innerHTML = isNew ? '<span class="newbest">New best!</span>' : 'Best <b>' + save.best + '</b>';
    setTimeout(() => show('over'), 300);
  }

  /* ---------- Screens ---------- */
  let currentScreen = 'start';
  function show(name){
    for (const k in screens) screens[k].classList.toggle('hidden', k !== name);
    currentScreen = name;
    if (name === 'start') refreshCoinsUI();
    updateMuteVis();
  }
  function hideAll(){ for (const k in screens) screens[k].classList.add('hidden'); currentScreen = null; }

  function startPlay(atLevel){ ac(); hideAll(); reset(atLevel); state = STATE.PLAY; updateMuteVis(); }

  function renderLevels(){
    const grid = document.getElementById('lvl-grid');
    const max = Math.min(40, Math.max(12, save.highestLevel + 2));
    grid.innerHTML = '';
    for (let i=1;i<=max;i++){
      const b = document.createElement('button');
      b.className = 'lvl' + (i <= save.highestLevel ? ' reached' : '');
      b.textContent = i;
      b.addEventListener('click', () => startPlay(i));
      grid.appendChild(b);
    }
  }

  /* ---------- Input ---------- */
  function reverse(){ if (state === STATE.PLAY){ dir *= -1; SFX.reverse(); } }
  stage.addEventListener('pointerdown', () => reverse());
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyM'){ toggleMute(); return; }
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){
      e.preventDefault();
      if (state === STATE.PLAY) reverse();
      else if (currentScreen === 'start') startPlay(1);
    }
  });

  document.getElementById('btn-play').addEventListener('click', () => startPlay(1));
  document.getElementById('btn-levels').addEventListener('click', () => { renderLevels(); show('levels'); });
  document.getElementById('btn-store').addEventListener('click', openHubStore);
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => show('start')));
  document.getElementById('btn-retry').addEventListener('click', () => startPlay(runStartLevel));
  document.getElementById('btn-over-levels').addEventListener('click', () => { renderLevels(); show('levels'); });
  document.getElementById('btn-over-store').addEventListener('click', openHubStore);
  document.getElementById('btn-over-menu').addEventListener('click', () => show('start'));

  /* ---------- Mute toggle ---------- */
  const muteBtn = document.getElementById('mute');
  function renderMute(){
    muteBtn.innerHTML = muted ? '&#128263;' : '&#9834;';
    muteBtn.classList.toggle('muted', muted);
    muteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
  }
  function toggleMute(){ muted = !muted; save.muted = muted; persist(); renderMute(); if (!muted) ac(); }
  function updateMuteVis(){ if (muteBtn) muteBtn.style.display = (currentScreen === 'start' || currentScreen === null) ? 'flex' : 'none'; }
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
  renderMute(); updateMuteVis();

  refreshCoinsUI();

  /* ---------- Update ---------- */
  function update(dt){
    if (state === STATE.PLAY){
      elapsed += dt; runTime += dt;
      playerAngle += dir * playerSpeed * dt;

      const p = playerPos();
      trail.push({ x:p.x, y:p.y, life:1 });
      if (trail.length > 18) trail.shift();

      spawnTimer -= dt;
      if (spawnTimer <= 0){ spawnRing(); spawnTimer = spawnInterval(); }

      const scale = moveScale();
      for (const ring of rings){
        const prev = ring.r;
        ring.r += ring.spd * dt * scale;
        if (!ring.scored && prev < R && ring.r >= R){
          ring.scored = true;
          if (angDist(playerAngle, ring.gap) <= ring.gh){
            scorePoint();
          } else if (shields > 0){
            shields--; shieldFlash = 0.45; shake = Math.max(shake, 8); SFX.shield(); haptic(35);
          } else {
            die();
          }
        }
        if (ring.r > R + Math.min(W,H)) ring.dead = 1;
      }
      rings = rings.filter(r => !r.dead);
    }

    for (const t of trail) t.life -= dt*3.4;
    while (trail.length && trail[0].life <= 0) trail.shift();
    for (const pt of particles){ pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx *= 0.92; pt.vy *= 0.92; pt.life -= dt*1.3; }
    particles = particles.filter(pt => pt.life > 0);
    if (shake > 0) shake = Math.max(0, shake - dt*60);
    if (shieldFlash > 0) shieldFlash = Math.max(0, shieldFlash - dt);
    if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - dt*1.6);
  }

  /* ---------- Draw ---------- */
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(234,230,255,0.07)'; ctx.lineWidth = 1; ctx.stroke();

    for (const ring of rings){
      const start = ring.gap + ring.gh, end = ring.gap - ring.gh + Math.PI*2;
      const near = 1 - Math.min(1, Math.abs(ring.r - R)/R);
      ctx.beginPath(); ctx.arc(CX,CY,ring.r,start,end);
      ctx.strokeStyle = ring.scored ? 'rgba(120,110,160,0.35)' : ring.color;
      ctx.globalAlpha = ring.scored ? 0.5 : (0.55 + near*0.45);
      ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.shadowBlur = 12*near; ctx.shadowColor = ring.color;
      ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      if (!ring.scored){
        for (const ga of [ring.gap-ring.gh, ring.gap+ring.gh]){
          ctx.beginPath(); ctx.arc(CX+Math.cos(ga)*ring.r, CY+Math.sin(ga)*ring.r, 4.5, 0, Math.PI*2);
          ctx.fillStyle = C.gap; ctx.globalAlpha = 0.4 + near*0.6;
          ctx.shadowBlur = 10; ctx.shadowColor = C.gap; ctx.fill();
          ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        }
      }
    }

    const pulse = 1 + Math.sin(elapsed*3)*0.12, coreR = R*0.11*pulse;
    const grd = ctx.createRadialGradient(CX,CY,0,CX,CY,coreR*3);
    grd.addColorStop(0, C.core); grd.addColorStop(0.4,'rgba(143,228,255,0.35)'); grd.addColorStop(1,'rgba(143,228,255,0)');
    ctx.beginPath(); ctx.arc(CX,CY,coreR*3,0,Math.PI*2); ctx.fillStyle = grd; ctx.fill();
    ctx.beginPath(); ctx.arc(CX,CY,coreR,0,Math.PI*2); ctx.fillStyle = C.core; ctx.fill();

    for (let i=0;i<trail.length;i++){
      const t = trail[i];
      ctx.beginPath(); ctx.arc(t.x,t.y,7*(i/trail.length),0,Math.PI*2);
      ctx.fillStyle = C.playerGlow; ctx.globalAlpha = 0.22*t.life*(i/trail.length); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state !== STATE.OVER){
      const p = playerPos();
      if (shields > 0 || shieldFlash > 0){
        ctx.beginPath(); ctx.arc(p.x,p.y,15,0,Math.PI*2);
        ctx.strokeStyle = C.gap; ctx.lineWidth = 2.5;
        ctx.globalAlpha = shieldFlash > 0 ? 0.9 : (0.4 + Math.sin(elapsed*5)*0.15);
        ctx.shadowBlur = 12; ctx.shadowColor = C.gap; ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      }
      ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2);
      ctx.fillStyle = C.player; ctx.shadowBlur = 22; ctx.shadowColor = C.playerGlow; ctx.fill(); ctx.shadowBlur = 0;
    }

    for (const pt of particles){
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r*pt.life,0,Math.PI*2);
      ctx.fillStyle = pt.color || C.danger; ctx.globalAlpha = pt.life; ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (deathFlash > 0){ ctx.fillStyle = 'rgba(255,92,138,' + (deathFlash*0.35) + ')'; ctx.fillRect(0,0,W,H); }
  }

  let last = performance.now();
  function frame(now){
    let dt = (now-last)/1000; last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
